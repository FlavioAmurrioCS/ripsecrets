---
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to emulate"
        required: true
        type: string
      publish:
        description: "Whether to publish the draft release after signing (set false for a trial run)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

# Tag releases are never cancelled; dispatch runs for the same tag replace
# each other so the newest workflow revision wins.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  determine-tag:
    name: Determine tag to use
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.on-push.outputs.tag }}
      input: ${{ steps.on-workflow.outputs.tag }}
      tag: ${{ steps.on-push.outputs.tag || steps.on-workflow.outputs.tag }}
      version: ${{ steps.combine.outputs.version }}

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Use Git ref
        id: on-push
        if: ${{ github.event_name == 'push' }}
        run: |
          echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Use workflow input
        id: on-workflow
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT

      - name: Determine actual tag
        id: combine
        run: |
          REF=${{ steps.on-push.outputs.tag }}
          INPUT=${{ steps.on-workflow.outputs.tag }}
          if [[ -n "$REF" ]]; then
            echo "version=${REF:1}" >> $GITHUB_OUTPUT
          elif [[ -n "$INPUT" ]]; then
            echo "version=${INPUT:1}" >> $GITHUB_OUTPUT
          fi

      # The archive is named after the Cargo.toml version, so a tag that
      # disagrees with it would ship mislabelled binaries.
      - name: Check the tag matches Cargo.toml
        env:
          VERSION: ${{ steps.combine.outputs.version }}
        run: |
          cargo_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$VERSION" != "$cargo_version" ]; then
            echo "::error::Tag version $VERSION does not match Cargo.toml version $cargo_version"
            exit 1
          fi

  build-binaries:
    name: Build release archive for ${{ matrix.os-arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    needs:
      - determine-tag
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are statically linked against musl so they run on
          # any distro.
          - runner: ubuntu-latest
            os-arch: linux-x64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            os-arch: linux-arm64
            target: aarch64-unknown-linux-musl
          - runner: macos-15
            os-arch: darwin-arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            os-arch: darwin-x64
            target: x86_64-apple-darwin
    env:
      VERSION: ${{ needs.determine-tag.outputs.version }}
      TARGET: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build the release binary
        run: cargo build --release --locked --target "$TARGET"

      # Layout:
      #
      #   ripsecrets-<version>/bin/ripsecrets
      #   ripsecrets-<version>/share/man/man1/ripsecrets.1
      #   ripsecrets-<version>/share/{bash-completion/completions, zsh/site-functions, fish/vendor_completions.d}/...
      - name: Assemble the release archive
        run: |
          set -euo pipefail
          # build.rs writes the man page and completions into OUT_DIR.
          out_dir="$(dirname "$(find "target/$TARGET/release/build" -path '*/out/ripsecrets.1' -print -quit)")"
          root="ripsecrets-${VERSION}"
          # macOS install(1) has no -D, so create the directories first.
          mkdir -p "$root/bin" "$root/share/man/man1" \
            "$root/share/bash-completion/completions" \
            "$root/share/zsh/site-functions" \
            "$root/share/fish/vendor_completions.d"
          install -m0755 "target/$TARGET/release/ripsecrets" "$root/bin/ripsecrets"
          install -m0644 "$out_dir/ripsecrets.1" "$root/share/man/man1/ripsecrets.1"
          install -m0644 "$out_dir/ripsecrets.bash" "$root/share/bash-completion/completions/ripsecrets"
          install -m0644 "$out_dir/_ripsecrets" "$root/share/zsh/site-functions/_ripsecrets"
          install -m0644 "$out_dir/ripsecrets.fish" "$root/share/fish/vendor_completions.d/ripsecrets.fish"

          # BSD tar on macOS lacks the options for a reproducible archive.
          tar=tar
          if [ "$RUNNER_OS" = macOS ]; then
            command -v gtar >/dev/null || brew install gnu-tar
            tar=gtar
          fi
          mkdir -p dist
          GZIP=-n "$tar" -czf "dist/ripsecrets-${VERSION}-${{ matrix.os-arch }}.tar.gz" \
            --sort=name --format=gnu --owner=0 --group=0 --mtime='@0' "$root"

      - name: Smoke test the archive
        run: |
          set -euo pipefail
          smoke="$(mktemp -d)"
          tar -xzf dist/ripsecrets-*.tar.gz -C "$smoke"
          bin="$smoke/ripsecrets-$VERSION/bin/ripsecrets"
          version="$("$bin" --version | awk '{print $NF}')"
          if [ "$version" != "$VERSION" ]; then
            echo "::error::Archive reports version $version, expected $VERSION"
            exit 1
          fi
          # Fail on any library a stock install of the OS would not have.
          if [ "$RUNNER_OS" = macOS ]; then
            otool -L "$bin"
            if otool -L "$bin" | tail -n +2 | grep -vE '^\s*/(usr/lib|System/Library)/'; then
              echo "::error::Binary links against non-system libraries"
              exit 1
            fi
          else
            file "$bin"
            if ! file "$bin" | grep -qE 'statically linked|static-pie linked'; then
              echo "::error::Linux binary is not statically linked"
              exit 1
            fi
          fi

      - name: Save the archive
        uses: actions/upload-artifact@v5
        with:
          name: binaries-${{ matrix.os-arch }}
          path: dist
          if-no-files-found: error
          retention-days: 1

  release-binaries:
    name: Create the draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - determine-tag
      - build-binaries
    permissions:
      contents: write
    outputs:
      created: ${{ steps.stage.outputs.created }}
      release-id: ${{ steps.stage.outputs.release-id }}
    env:
      VERSION: ${{ needs.determine-tag.outputs.version }}
      TAG: ${{ needs.determine-tag.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      # These jobs have no checkout, so gh cannot infer the repository.
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Collect build artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist

      - name: Stage the release assets
        id: stage
        run: |
          set -euo pipefail
          cd dist
          sha256sum ripsecrets-*.tar.gz > SHASUMS256.txt
          cd ..

          # The release is kept a draft through signing; security best practice
          # for repositories with immutable releases, and it lets the final job
          # verify every asset digest before users ever see the release.
          if [ "$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null)" = "true" ]; then
            echo "Refresh assets of the existing draft for $TAG"
            gh release upload "$TAG" --clobber dist/ripsecrets-*.tar.gz dist/SHASUMS256.txt
            echo "created=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$(gh release view "$TAG" --json name --jq '.name' 2>/dev/null)" ]; then
            echo "::warning::Release $TAG already exists and is published; skipping"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            gh release create "$TAG" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "ripsecrets $VERSION" \
              --generate-notes \
              dist/ripsecrets-*.tar.gz \
              dist/SHASUMS256.txt
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
          # The numeric REST id: drafts are not reachable via releases/tags/<tag>.
          release_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id")"
          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Stage the release for the packslip job
        if: steps.stage.outputs.created == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: release-assets
          path: dist
          if-no-files-found: error
          retention-days: 1

  packslip:
    name: Sign the release with packslip
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - determine-tag
      - release-binaries
    if: needs.release-binaries.outputs.created == 'true'
    permissions:
      contents: write # attach the signed bundle to the draft release
      id-token: write # sign with the workflow's identity
      attestations: write # build provenance for the collected artifacts
    env:
      TAG: ${{ needs.determine-tag.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      # These jobs have no checkout, so gh cannot infer the repository.
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Collect release assets
        uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: dist

      - name: Remove a previously attached bundle
        run: |
          gh release delete-asset "$TAG" packslip.sigstore.json --yes 2>/dev/null || true

      # The signed statement records every artifact with its digest, the
      # executable inside it, which platform each file is for, and the
      # resources (man page, completions) it ships, and signs it with this
      # workflow's Sigstore identity. A consumer can verify that the file it
      # is about to install was built by this repository. See
      # https://packslip.dev.
      #
      # attest keeps its default (true): each artifact is attested with
      # actions/attest-build-provenance and linked from the bundle. upload
      # keeps its default (true): packslip.sigstore.json is attached to the
      # release itself.
      #
      # NB: this step must keep running from this workflow file: consumers
      # pin the signer's workflow, and moving it elsewhere makes them ask a
      # person to approve the next release.
      - uses: jdx/packslip@693d02c49f6e1c8a0cc797472dc3fa53f0a6c955 # v1.9.1
        with:
          artifacts: dist/ripsecrets-*.tar.gz
          bin: ripsecrets
          tag: ${{ needs.determine-tag.outputs.tag }}
          resources: |
            man=archive:ripsecrets-${{ needs.determine-tag.outputs.version }}/share/man/man1/ripsecrets.1
            completion/bash=archive:ripsecrets-${{ needs.determine-tag.outputs.version }}/share/bash-completion/completions/ripsecrets
            completion/zsh=archive:ripsecrets-${{ needs.determine-tag.outputs.version }}/share/zsh/site-functions/_ripsecrets
            completion/fish=archive:ripsecrets-${{ needs.determine-tag.outputs.version }}/share/fish/vendor_completions.d/ripsecrets.fish

  publish-binaries:
    name: Verify assets and publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - determine-tag
      - release-binaries
      - packslip
    if: ${{ !cancelled() && needs.release-binaries.outputs.created == 'true' && needs.packslip.result == 'success' }}
    permissions:
      contents: write
    env:
      TAG: ${{ needs.determine-tag.outputs.tag }}
      RELEASE_ID: ${{ needs.release-binaries.outputs.release-id }}
      # On a tag push, always publish. Dispatches decide for themselves so a
      # trial run can be inspected manually before it is published.
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
      GH_TOKEN: ${{ github.token }}
      # These jobs have no checkout, so gh cannot infer the repository.
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Collect release assets
        uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: dist

      - name: Download the signed bundle
        run: gh release download "$TAG" --pattern packslip.sigstore.json --dir dist

      # Compare every asset of the draft against the files this workflow
      # built, so a stale archive or a wrong upload is caught before the
      # release goes public.
      - name: Verify uploaded assets match the built files
        run: |
          set -euo pipefail
          expected="$(cd dist && sha256sum -- * | sort)"
          actual="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --jq '.assets[] | select(.digest | startswith("sha256:")) | "\(.digest[7:])  \(.name)"' \
            | sort)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::Draft release assets do not match the built files"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi

      - name: Publish the draft release
        if: env.PUBLISH == 'true'
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false
          echo "Published $TAG"

      - name: Release left as a draft for review
        if: env.PUBLISH != 'true'
        run: |
          echo "publish input was false; leaving release $TAG as a draft for review"
